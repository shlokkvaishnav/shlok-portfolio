<!doctype html>
<html lang="en" style="background:#0a0a0c">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — signal lost</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0c;
        color: #a4a29c;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .noise {
        width: min(420px, 80vw);
        height: 6px;
        margin: 0 auto 28px;
        background: repeating-linear-gradient(
          90deg,
          rgba(232, 230, 225, 0.25) 0 2px,
          transparent 2px 5px,
          rgba(232, 230, 225, 0.12) 5px 6px,
          transparent 6px 11px
        );
        animation: crawl 1s steps(12) infinite;
      }
      @keyframes crawl {
        to {
          background-position: 66px 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .noise {
          animation: none;
        }
      }
      main {
        text-align: center;
        padding: 24px;
      }
      a {
        color: #e2b857;
        text-decoration: none;
        border-bottom: 1px solid rgba(226, 184, 87, 0.4);
        padding-bottom: 2px;
      }
      p {
        margin: 0 0 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="noise" aria-hidden="true"></div>
      <p>404 — no signal at this coordinate</p>
      <p><a href="/">return to the observatory</a></p>
    </main>
  </body>
</html>
