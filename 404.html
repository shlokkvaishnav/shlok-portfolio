<!doctype html>
<html lang="en" style="background:#05070a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — no path here</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #05070a;
        color: #78837c;
        font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        font-weight: 300;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      main {
        text-align: center;
        padding: 24px;
      }
      .rule {
        width: min(420px, 80vw);
        height: 1px;
        margin: 0 auto 30px;
        background: rgba(223, 231, 224, 0.13);
      }
      .jp {
        display: block;
        margin-bottom: 26px;
        font-size: 30px;
        letter-spacing: 0.3em;
        color: #dfe7e0;
        text-transform: none;
      }
      a {
        color: #dfe7e0;
        text-decoration: none;
        border-bottom: 1px solid rgba(224, 35, 28, 0.7);
        padding-bottom: 3px;
      }
      p {
        margin: 0 0 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="jp">道なし</span>
      <div class="rule" aria-hidden="true"></div>
      <p>404 — there is no path here</p>
      <p><a href="/">return to the gate</a></p>
    </main>
  </body>
</html>
