name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is static — no npm, no bundler. The only build-time step is
      # substituting the analytics site id, which is a repository variable
      # rather than a secret: it is public in the page source either way.
      # Unset simply means the snippet never inserts the script.
      - name: Inject analytics site id
        env:
          UMAMI_SITE_ID: ${{ vars.UMAMI_SITE_ID }}
        run: |
          if [ -n "$UMAMI_SITE_ID" ]; then
            sed -i "s/var id = 'UMAMI_SITE_ID';/var id = '$UMAMI_SITE_ID';/" index.html
            echo "Analytics enabled."
          else
            echo "UMAMI_SITE_ID unset — analytics stays off."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
